<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      style-src 'unsafe-inline' is required for Vue scoped styles (<style scoped>) which
      inject dynamic attribute selectors that cannot be nonce-hashed at build time.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' http: https: ws: wss: app:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" />
    <title>Phlix</title>
  </head>
  <body>
    <div id="phlix-app"></div>
    <div id="player-supplement-root"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
