name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# M-WINDOWS-24 (review windows__secaudit): least-privilege default — ordinary CI
# needs only read access to the repository. The two release jobs carry their own
# job-level `contents: write` (deliberate overrides); nothing else gets a write token.
permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # M-WINDOWS-25: bounded jobs. Windows npm ci (Electron download) + build +
    # two test passes + coverage historically lands near 15 min; 30 is headroom.
    timeout-minutes: 30

    strategy:
      # A failure on one OS must not cancel the other matrix leg — the two legs
      # validate independent surfaces (and the default fail-fast:true already
      # cancelled the Windows results whenever the Ubuntu leg failed).
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm test -- --coverage
        # NOTE: this MUST be matrix.os, not runner.os. `runner.os` evaluates to
        # Linux/Windows/macOS and can NEVER equal 'ubuntu-26.04', so the previous
        # condition was always false and these three steps never ran once.
        if: matrix.os == 'ubuntu-26.04' && matrix.node-version == '24.x'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        # NOTE: this MUST be matrix.os, not runner.os. `runner.os` evaluates to
        # Linux/Windows/macOS and can NEVER equal 'ubuntu-26.04', so the previous
        # condition was always false and these three steps never ran once.
        if: matrix.os == 'ubuntu-26.04' && matrix.node-version == '24.x'
        with:
          files: ./coverage/lcov.info
          # The coverage threshold (vitest, see vitest.config.mts) already gates
          # the run — this upload is best-effort. The repo's CODECOV_TOKEN does
          # not currently authorize uploads to this repository ("Repository not
          # found"), and failing CI on an external token issue hides real regressions.
          fail_ci_if_error: false
          # master is a protected branch — Codecov rejects anonymous uploads to it
          # ("Token required because branch is protected"), so pass the provisioned
          # repository token explicitly when one is available.
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        continue-on-error: true
        # NOTE: this MUST be matrix.os, not runner.os. `runner.os` evaluates to
        # Linux/Windows/macOS and can NEVER equal 'ubuntu-26.04', so the previous
        # condition was always false and these three steps never ran once.
        if: matrix.os == 'ubuntu-26.04' && matrix.node-version == '24.x'
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: ./coverage/lcov.info

      # Audit runs LAST in the step graph on purpose: any failing step without
      # `if: always()` skips everything after it, so the old audit-first ordering
      # let a red `npm audit` silently skip every vitest signal (proven at
      # 633863a: Test job red on audit alone, 0 tests executed). As the final
      # step it still hard-gates the job on both matrix legs while tests,
      # coverage and the best-effort uploads always report first.
      #
      # `node scripts/audit-gate.mjs` wraps `npm audit --json --audit-level=high`
      # with an explicit, justified advisory allow-list. The allow-list is
      # currently EMPTY (2026-10-29 sweep: the two founding dev-chain entries —
      # ch52 http-cache-semantics, fixed by taking 4.3.0 in-range, and hp3w
      # sprintf-js, withdrawn upstream — were both retired, and the 22 fresh
      # time-drift advisories on vitest/electron/fast-uri/follow-redirects/
      # undici/vite all cleared by in-parent-range version bumps). Raw exit
      # code — no `|| true`, no continue-on-error: the gate fails the job on
      # any advisory AND on any neutering vector (unparseable/unknown audit
      # output, failed spawn, broken audit reporting zero advisories). See the
      # script header for the reviewed-decision law on adding entries.
      - name: Security audit
        run: node scripts/audit-gate.mjs

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  types:
    name: Type Check
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check renderer
        run: npx vue-tsc --noEmit

      - name: Type check main process
        run: npx tsc -p tsconfig.main.json --noEmit

      - name: Type check tests
        run: npx vue-tsc --noEmit -p tsconfig.test.json

  smoke:
    name: Smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      # Same reasoning as the test job: a Linux smoke failure must not cancel the
      # Windows leg (which has to download Electron + Playwright first).
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run smoke test (Linux)
        if: matrix.os == 'ubuntu-26.04'
        run: xvfb-run --auto-servernum npm run smoke

      - name: Run smoke test (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run smoke
