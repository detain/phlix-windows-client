name: CodeQL

on:
  push:
    # windows__devops 6[i] (w08/L2): master-only — matching build.yml/test.yml;
    # the main entry could never fire in this master-only repo.
    branches: [master]
    paths:
      - 'src/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - '.github/workflows/codeql.yml'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04
    # M-WINDOWS-25 family law: every job carries a deliberate bound. CodeQL's
    # TS+Electron analysis is a ~10-minute job; 30 is generous headroom without
    # letting a stuck runner hang the branch protection check indefinitely.
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Build
        run: |
          npm ci
          # windows__devops 5[i] (w08/L2): the sub-script legs bypass the
          # package.json `prebuild` hook — run the asset check explicitly so
          # every CI build path applies the same gate.
          node scripts/check-assets.mjs
          npm run build:vite
          npm run build:electron

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: '/language:${{ matrix.language }}'
