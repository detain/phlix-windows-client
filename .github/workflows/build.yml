name: Build

on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'package.json'
      - 'electron-builder.*'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: false
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    # M-WINDOWS-25: every job carries an explicit ceiling (GitHub's implicit
    # default is 6 h); values below are measured-p99 + generous headroom.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check renderer
        run: npx vue-tsc --noEmit

      - name: Type check main process
        run: npx tsc -p tsconfig.main.json --noEmit

      - name: Type check tests
        run: npx vue-tsc --noEmit -p tsconfig.test.json

  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Run tests
        run: npm test

  smoke:
    name: Smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      # Windows runners need ~10 min just for npm ci (Electron download) — the
      # previous 10-min timeout cancelled the Windows leg mid-build. Also keep the
      # two legs independent so a Linux failure cannot cancel the Windows result.
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run smoke test (Linux)
        if: matrix.os == 'ubuntu-26.04'
        run: xvfb-run --auto-servernum npm run smoke

      - name: Run smoke test (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run smoke

  # ─── audit ────────────────────────────────────────────────────────────────────
  # Dependabot was evaluated but not used — this repo follows a no-PR-push-to-master
  # workflow (tags are the release trigger), so Dependabot's PR model doesn't fit.
  # Dependency updates are handled manually or via the tag workflow.
  audit:
    name: Security Audit
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Allow-list gate (same contract as test.yml's Security audit step): raw
      # exit code, no `|| true`. Passes only while every reported advisory id is
      # explicitly justified in scripts/audit-gate.mjs's ALLOWED_ADVISORIES —
      # currently EMPTY (the two founding dev-chain entries ch52/hp3w were
      # retired 2026-10-29: ch52 fixed by taking http-cache-semantics 4.3.0 in
      # its parent's declared range, hp3w-withdrawn-by-GitHub; the 22 fresh
      # time-drift advisories all cleared by in-parent-range bumps). Any other
      # advisory — or any unread/failed audit — reddens this job, which blocks
      # the build → release-latest/release chain below by `needs:`.
      - name: Run npm audit
        run: node scripts/audit-gate.mjs

  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    # Packaging legs download code-signing toolchains and run electron-builder
    # twice on Windows runners; 45 min is p99 (~20 observed) with room.
    timeout-minutes: 45
    needs: [lint, typecheck, test, smoke, audit]

    strategy:
      # Keep the NSIS and APPX packaging legs independent — a failure in one
      # must not cancel the other (they validate separate packaging paths).
      fail-fast: false
      matrix:
        include:
          - target: nsis
            runs-on: windows-latest
          - target: appx
            runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:vite

      - name: Build main process
        run: npm run build:electron

      - name: Package NSIS installer
        if: matrix.target == 'nsis'
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package APPX
        if: matrix.target == 'appx'
        run: npx electron-builder --win appx --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256 checksums
        # sha256sum is available on windows-latest; output goes to release/
        # which is already gitignored so no cleanup needed.
        # Explicit bash shell: the default on windows-latest is PowerShell,
        # which cannot parse the POSIX redirection below.
        shell: bash
        run: |
          cd release
          sha256sum *.exe *.appx *.nupkg > SHA256SUMS.txt 2>/dev/null || echo "No artifacts found" >&2

      - name: Upload artifacts
        # The nsis leg's release/ also carries electron-builder's own updater
        # feed (latest.yml, sha512 schema) and the installer's .blockmap used
        # for differential downloads — both must reach the versioned release
        # verbatim (M-WINDOWS-05: the feed was previously hand-fabricated in
        # the release job from a sha256 the updater cannot consume). The appx
        # leg emits no feed (electronUpdaterAware is unset), and unmatched
        # patterns are tolerated by upload-artifact as long as the set is
        # non-empty — exactly how *.appx never matching in the nsis leg today
        # still uploads.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phlix-windows-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.appx
            release/*.nupkg
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error

  # ─── updater note ─────────────────────────────────────────────────────────────
  # The updater feed is electron-builder's OWN release/latest.yml (sha512
  # schema), generated during the nsis packaging leg because package.json
  # build.publish is the GitHub provider, carried through the artifact upload
  # verbatim, and attached only to the versioned tag release below — never to
  # the rolling `latest` prerelease. The client itself pins the update policy:
  # src/main/index.ts sets autoUpdater.allowPrerelease = false, so the rolling
  # prerelease serves downloads only. Feed url ↔ GitHub asset name ↔ the
  # provider's dash-normalized download path are one string by the space-free
  # nsis.artifactName law in package.json (M-WINDOWS-05: this workflow used to
  # hand-write a sha256 look-alike no updater can verify). If @phlix/ui (the
  # consuming package) ever ships its own auto-updater, it overrides these
  # choices there — this repo hosts the installer artifacts and the feed.

  # ─── version-check ────────────────────────────────────────────────────────────
  # Runs before any release job. Fails if package.json version does not match
  # the tag being pushed, preventing accidental drift between code and release.
  version-check:
    name: Version drift check
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Extract tag version
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract package.json version
        id: pkg_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Fail if versions diverge
        run: |
          if [[ "${{ steps.tag_version.outputs.VERSION }}" != "${{ steps.pkg_version.outputs.VERSION }}" ]]; then
            echo "ERROR: tag version '${{ steps.tag_version.outputs.VERSION }}' != package.json version '${{ steps.pkg_version.outputs.VERSION }}'"
            exit 1
          fi
          echo "Version check passed: ${{ steps.tag_version.outputs.VERSION }}"

  release-latest:
    name: Update "latest" prerelease
    needs: build
    # On every master push, overwrite a rolling "latest" GitHub Release carrying
    # the RAW .exe/.appx as directly-downloadable assets. (GitHub Actions
    # artifacts are always served zipped — a Release is the only way to offer a
    # bare, clickable installer.) Skipped on PRs and tag pushes (tags cut a
    # versioned release via the `release` job below).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download NSIS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phlix-windows-nsis
          path: artifacts/nsis

      - name: Download APPX artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phlix-windows-appx
          path: artifacts/appx

      - name: Generate SHA256 checksums for release artifacts
        run: |
          cd artifacts
          sha256sum nsis/*.exe nsis/*.appx nsis/*.nupkg appx/*.exe appx/*.appx appx/*.nupkg > SHA256SUMS.txt 2>/dev/null || echo "No artifacts found" >&2
          cat SHA256SUMS.txt

      - name: Reset "latest" release + tag
        # Delete any existing rolling release and its tag so the recreated one
        # points at this commit and carries only the freshly-built installers
        # (no stale assets from a prior master build accumulate).
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish "latest" prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest
          name: Latest (master)
          body: |
            Rolling build of the latest `master` commit (${{ github.sha }}).
            Download the raw installer directly — no zip:
            - **`.exe`** — NSIS installer (desktop install)
            - **`.appx`** — sideload package (installing an unsigned `.appx`
              requires a trusted certificate or Developer Mode — prefer the `.exe`)

            **Unsigned build:** no Authenticode certificate is provisioned for
            this project yet, so SmartScreen shows "Windows protected your PC"
            with publisher **Unknown** on first run — expected behavior of
            unsigned software, not a sign of malware. Verify the download
            against **SHA256SUMS.txt** and follow the README section *"First
            run: 'Windows protected your PC'"* (Get-FileHash check, then More
            info → Run anyway). Signing status and future path: `docs/signing.md`.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/nsis/*.exe
            artifacts/appx/*.appx
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create Release
    needs: [build, version-check]
    # Only publish a GitHub Release on a version tag — master/PR builds just
    # upload installer artifacts (above) without cutting a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download NSIS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phlix-windows-nsis
          path: artifacts/nsis

      - name: Download APPX artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phlix-windows-appx
          path: artifacts/appx

      # ── Signing — INACTIVE (W4.10): releases ship UNSIGNED ───────────────────
      # Measured 2026-10-29: no Authenticode certificate secret is provisioned
      # for this repo, nothing on any leg signs anything, and every published
      # artifact — the rolling "latest" prerelease and any future tag release —
      # ships as a bare UNSIGNED .exe/.appx. That is the documented reality the
      # README already teaches users to live with ("First run: 'Windows
      # protected your PC'" — SmartScreen reports Unknown Publisher; verify the
      # download against SHA256SUMS.txt with Get-FileHash, then More info → Run
      # anyway). Provisioning certificates is a repo-OWNER action; until then
      # every trust-adjacent claim in this repo must match the paragraph above.
      #
      # The sketch below is the FUTURE signing path, kept commented. Uncomment-
      # ing is NOT sufficient to enable it:
      #   • Secret names are canonicalized to docs/signing.md — the single
      #     source of truth: AUTHENTICODE_CERT / AUTHENTICODE_CERT_PASSWORD
      #     (NSIS), APPX_SIGNING_CERT / APPX_SIGNING_CERT_PASSWORD (APPX).
      #     tests/unit/signingPostureWorkflow.test.mjs round-trip-pins the
      #     names against the docs; the older ad-hoc names this comment used
      #     to carry contradicted the runbook and are permanently retired.
      #   • signtool.exe is a Windows SDK binary and does NOT exist on this
      #     ubuntu-26.04 job — the steps must run on a windows-latest leg (the
      #     build job already is one) with signed artifacts flowing into the
      #     release uploads, not in place here.
      #   • docs/signing.md "CI Signing Configuration" carries the aligned
      #     PowerShell sketch; land both sides together and re-pin the test's
      #     tripwires when signing actually goes live.
      #
      #   - name: Decode certificate          # windows leg, pwsh shell
      #     run: '[IO.File]::WriteAllBytes("certificate.pfx",[Convert]::FromBase64String($env:AUTHENTICODE_CERT))'
      #     env:
      #       AUTHENTICODE_CERT: ${{ secrets.AUTHENTICODE_CERT }}
      #       AUTHENTICODE_CERT_PASSWORD: ${{ secrets.AUTHENTICODE_CERT_PASSWORD }}
      #
      #   - name: Sign NSIS installer         # signtool path DISCOVERED, not hard-pinned (SDK version floats with the image)
      #     run: $st = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName; & $st sign /f certificate.pfx /p "$env:AUTHENTICODE_CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 artifacts/nsis/*.exe
      #     env:
      #       AUTHENTICODE_CERT_PASSWORD: ${{ secrets.AUTHENTICODE_CERT_PASSWORD }}
      #
      #   - name: Verify signature
      #     run: $st = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName; & $st verify /pa /v artifacts/nsis/*.exe
      # ─────────────────────────────────────────────────────────────────────────

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Generate SHA256 checksums
        id: sha256
        # Human-readable integrity companion for the release page. The
        # updater-facing integrity data is electron-builder's own sha512 in
        # artifacts/nsis/latest.yml (carried through the build artifact
        # upload); the per-file {f}.sha256 sidecars the old fabricated-feed
        # step consumed are gone with it (M-WINDOWS-05).
        # Only nsis + appx targets are configured (package.json "build"), so no
        # .nupkg is ever produced — unmatched globs would pass the literal
        # pattern to sha256sum and fail the step under bash -e.
        run: |
          cd artifacts
          sha256sum nsis/*.exe appx/*.appx > SHA256SUMS.txt

      - name: Verify the updater feed is electron-builder's own
        # Fail-loud gate replacing the old hand-written feed-generation steps
        # (which fabricated a sha256 NSIS feed + an APPX alias feed).
        # electron-builder's nsis leg writes release/latest.yml — the authentic
        # update metadata (version/path/sha512/files, plus blockMapSize for
        # differential downloads), because build.publish is the GitHub provider
        # — alongside the installer's .blockmap; the build job uploads both
        # verbatim.
        # electron-updater's GitHub provider requests this asset by name from
        # the release and verifies downloads against its sha512; a hand-rolled
        # sha256 look-alike is metadata it cannot check. If the builder config
        # ever stops emitting the feed, or a fabricated shape reappears, the
        # release fails HERE instead of shipping unverifiable metadata — or,
        # worse, softprops warning-and-skipping a missing file silently.
        run: |
          set -e
          VERSION='${{ steps.version.outputs.VERSION }}'
          test -f artifacts/nsis/latest.yml
          ls artifacts/nsis/*.exe.blockmap > /dev/null
          grep -q "^version: ${VERSION}$" artifacts/nsis/latest.yml
          grep -Eq '^sha512: [A-Za-z0-9+/=]+$' artifacts/nsis/latest.yml
          grep -Eq '^path: "?[A-Za-z0-9._-]+"?$' artifacts/nsis/latest.yml
          grep -Eq '^files:' artifacts/nsis/latest.yml
          if grep -Eq 'sha256:|target:' artifacts/nsis/latest.yml; then
            echo 'ERROR: latest.yml carries fabricated-schema fields (sha256:/target:) — not electron-builder output' >&2
            exit 1
          fi
          echo 'Updater feed verified (electron-builder sha512 schema, space-free url — see the nsis.artifactName law in package.json):'
          cat artifacts/nsis/latest.yml

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'alpha') }}
          generate_release_notes: true
          # Authentic NSIS updater triad: installer + its .blockmap (differential
          # downloads) + builder's latest.yml — the feed electron-updater's
          # GitHub provider fetches from the release by that exact asset name.
          # The old APPX alias feed is gone: appx is not an updater target on
          # Windows (NsisUpdater is) and never wrote a feed unless
          # electronUpdaterAware is set (it isn't) — no code path ever read it.
          files: |
            artifacts/nsis/*.exe
            artifacts/nsis/*.exe.blockmap
            artifacts/nsis/latest.yml
            artifacts/nsis/SHA256SUMS.txt
            artifacts/appx/*.appx
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
